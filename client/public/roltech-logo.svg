<svg width="120" height="50" viewBox="0 0 120 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="50" rx="8" fill="#2D2D37"/>
  
  <!-- Icon - Stylized Garage Door -->
  <g transform="translate(10, 12)">
    <!-- Door Frame -->
    <rect x="0" y="0" width="24" height="26" rx="2" fill="none" stroke="#60A5FA" stroke-width="2"/>
    
    <!-- Horizontal Door Sections -->
    <line x1="2" y1="6" x2="22" y2="6" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="2" y1="18" x2="22" y2="18" stroke="#60A5FA" stroke-width="1.5"/>
    
    <!-- Door Handle -->
    <circle cx="19" cy="20" r="1.5" fill="#60A5FA"/>
  </g>
  
  <!-- Company Name -->
  <text x="42" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Ролтех</text>
  <text x="42" y="35" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">GARAGE DOORS</text>
</svg>