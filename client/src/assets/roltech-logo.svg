<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- House structure -->
  <!-- Roof -->
  <polygon points="40,80 200,20 360,80 320,80 200,40 80,80" fill="#B22222"/>
  
  <!-- Main building -->
  <rect x="60" y="80" width="280" height="80" fill="#B22222"/>
  
  <!-- Windows on roof -->
  <rect x="120" y="50" width="30" height="20" fill="#ffffff"/>
  <rect x="185" y="50" width="30" height="20" fill="#ffffff"/>
  <rect x="250" y="50" width="30" height="20" fill="#ffffff"/>
  
  <!-- Garage door sections -->
  <rect x="80" y="100" width="240" height="12" fill="#2F4F4F"/>
  <rect x="80" y="112" width="240" height="12" fill="#2F4F4F"/>
  <rect x="80" y="124" width="240" height="12" fill="#2F4F4F"/>
  <rect x="80" y="136" width="240" height="12" fill="#2F4F4F"/>
  <rect x="80" y="148" width="240" height="12" fill="#2F4F4F"/>
  
  <!-- Arrow down (red) -->
  <polygon points="200,105 190,115 210,115" fill="#B22222"/>
  
  <!-- Arrow up (green) -->
  <polygon points="200,145 190,135 210,135" fill="#228B22"/>
  
  <!-- Side panels -->
  <rect x="60" y="100" width="20" height="60" fill="#B22222"/>
  <rect x="320" y="100" width="20" height="60" fill="#B22222"/>
  
  <!-- Text РОЛТЕХ -->
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#B22222" text-anchor="middle">РОЛТЕХ</text>
  
  <!-- Decorative lines -->
  <line x1="30" y1="190" x2="120" y2="190" stroke="#2F4F4F" stroke-width="2"/>
  <line x1="280" y1="190" x2="370" y2="190" stroke="#2F4F4F" stroke-width="2"/>
</svg>